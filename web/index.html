    html, body { margin: 0; height: 100%; background: #07060F; }
    #re-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(900px 600px at 50% 38%, #1d1640 0%, #0c0a1c 45%, #07060F 75%);

      transition: opacity .5s ease, transform .5s ease;
    }
    #re-splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
    .re-logo { width: 148px; height: 148px; filter: drop-shadow(0 12px 40px rgba(124, 92, 255, .35)); }
    .re-title { font-family: "Sora", system-ui, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -.8px; margin-top: 4px;
      background: linear-gradient(90deg, #F4F2FF 0%, #FFE3A3 55%, #F5B83D 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .re-sub { font-size: 14px; color: #A9A5C4; letter-spacing: .2px; margin-top: -8px; }
    .re-bar { width: 132px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 10px; }
    .re-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, rgba(245,184,61,0), #F5B83D, #FFE3A3);
      animation: re-load 1.2s cubic-bezier(.45,.05,.55,.95) infinite; }
    @keyframes re-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes re-in { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
    #re-splash > * { animation: re-in .6s cubic-bezier(.2,.8,.2,1) both; }
    #re-splash > :nth-child(2) { animation-delay: .08s; }
    #re-splash > :nth-child(3) { animation-delay: .16s; }
    #re-splash > :nth-child(4) { animation-delay: .24s; }
  </style>
